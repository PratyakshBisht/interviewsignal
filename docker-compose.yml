version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: interviewsignal-backend:latest
    container_name: interviewsignal-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./interviewsignal.db
      APP_SECRET_KEY: ${APP_SECRET_KEY:-interviewsignal_development_secret_key_1234567890}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    image: interviewsignal-frontend:latest
    container_name: interviewsignal-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
